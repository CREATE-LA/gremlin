name: Static security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    name: Static security boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable commit
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check-security.py
      - run: node .github/scripts/check-sound.cjs
      - run: node .github/scripts/check-app.cjs
      - run: node .github/scripts/check-analytics.cjs
