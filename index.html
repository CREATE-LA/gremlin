<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; upgrade-insecure-requests"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a2a2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Gremlin — CREATE</title><meta name="description" content="Meet CREATE’s Halloween gremlin. Tap, hold, and tear to see what happens."><meta property="og:title" content="Gremlin — CREATE"><meta property="og:description" content="Tap, hold, and tear. A little Halloween mischief from CREATE."><meta property="og:url" content="https://create-la.github.io/gremlin/"><style>
:root{--bg:#2a2a2a;--ink:#cccccc;--btn-fg:#2a2a2a;--hov:#cccccc}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;overflow:hidden;transition:background .35s}
main{position:relative;height:100dvh}
#scene{position:absolute;inset:0;pointer-events:none}
#scene>svg{display:block;width:100%;height:100%}
#pull{position:absolute;left:16%;width:68%;top:38%;height:25%;border:0;background:none;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pull:active{cursor:grabbing}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
.hint{position:absolute;z-index:2;top:calc(50% + min(6vw,6vh) + 14px);left:50%;width:max-content;max-width:90%;transform:translateX(-50%);text-align:center;font-size:12px;letter-spacing:.02em;pointer-events:none;opacity:1;transition:opacity .45s ease-out}
.hint svg{display:block;width:30px;height:27px;margin:0 auto 8px;overflow:visible}
.hint.is-dismissed{opacity:0}
.bar{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.palette{display:flex;flex-shrink:0;gap:0;padding:3px;border:1px solid var(--ink);border-radius:999px;background:var(--bg)}
.sw{position:relative;width:44px;height:44px;padding:0;border:0;background:transparent;border-radius:50%;cursor:pointer}
.sw:before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--sw);border:1px solid #808080;transition:transform .15s ease-out}
.sw[aria-pressed=true]:before{outline:2px solid var(--ink);outline-offset:3px}
.sw[aria-pressed=true]:after{content:'';position:absolute;left:20px;top:20px;width:4px;height:4px;border-radius:50%;background:var(--mark)}
.selector{position:relative;flex-shrink:0}
.selector:after{content:'';position:absolute;right:15px;top:18px;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);pointer-events:none;color:var(--btn-fg)}
#mode,#clear{height:44px;border:1px solid var(--ink);border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap}
#mode{width:104px;appearance:none;-webkit-appearance:none;background:var(--ink);color:var(--btn-fg);padding:0 28px 0 13px}
#mode option{background:var(--bg);color:var(--ink)}
#clear{padding:0 12px;background:transparent;color:var(--ink)}
#sound{position:fixed;right:12px;top:calc(6px + env(safe-area-inset-top,0px));width:44px;height:44px;border:0;background:transparent;color:var(--ink);font-size:20px;z-index:4;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(hover:hover){.sw:hover:before{transform:scale(1.1)}#clear:hover{background:var(--ink);color:var(--btn-fg)}}
@media(min-width:601px){.bar{gap:12px;padding-bottom:24px}.hint{font-size:13px}#mode{width:112px}#clear{padding:0 16px}}
@media(max-width:389px){.bar{gap:6px;padding-left:8px;padding-right:8px}.palette{padding:1px}#clear{padding:0 10px}}
@media(max-width:374px){.bar{flex-wrap:wrap;max-width:300px;margin:auto;gap:10px}.palette{margin:0 44px}}
@media(orientation:landscape){#pull{left:25%;width:50%;top:33%;height:34%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main>
  <div id="scene" aria-hidden="true"></div>
  <button id="pull" aria-label="Tap the logo to let him out. Hold to make the eyes strain, or drag to tear." aria-describedby="hint"></button>
  <div class="hint" id="hint"><svg viewBox="0 0 30 27" aria-hidden="true"><path d="M22 25C9 23 9 13 15 3M8 7L15 2L19 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Tap to let him out.</div>
</main>
<div class="bar" role="group" aria-label="Play controls">
  <div class="palette" role="group" aria-label="Color palette">
    <button class="sw" data-c="#2a2a2a" style="--sw:#2a2a2a;--mark:#cccccc" aria-label="Charcoal background" aria-pressed="true"></button>
    <button class="sw" data-c="#cccccc" style="--sw:#cccccc;--mark:#2a2a2a" aria-label="Gray background" aria-pressed="false"></button>
    <button class="sw" data-c="#edff00" style="--sw:#edff00;--mark:#2a2a2a" aria-label="Neon background" aria-pressed="false"></button>
    <button class="sw" data-c="#ff6941" style="--sw:#ff6941;--mark:#2a2a2a" aria-label="Orange background" aria-pressed="false"></button>
  </div>
  <div class="selector"><select id="mode" aria-label="Choose animation"><option value="bats">Bats</option><option value="ghosts">Ghosts</option><option value="eyes">Eyeballs</option><option value="surprise">Surprise</option></select></div>
  <button id="clear">Clear</button>
</div>
<button id="sound" aria-label="Turn sound on" aria-pressed="false">♪</button>
<div id="status" class="sr" role="status" aria-live="polite"></div>
<script src="bootstrap.js?v=35"></script><script src="idle.js?v=37"></script><script src="scene.js?v=37"></script><script src="surprise.js?v=34"></script><script src="rewards.js?v=34"></script><script src="palette.js?v=34"></script><script src="story27.js?v=37"></script><script src="sound.js?v=34"></script><script src="renderer.js?v=37"></script><script src="perf.js?v=34"></script><script src="app.js?v=38"></script></body></html>
